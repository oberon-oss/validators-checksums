name: CI/CD Pipeline

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    workflow_dispatch:

jobs:
    pipeline:
        #     v2.0.1
        uses: oberon-oss/github-workflows/.github/workflows/maven-pipeline.yml@18394ff206a3269a6904a48e5ea876a8e6cb6f5b
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
            NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}