name: CI/CD Pipeline

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    workflow_dispatch:

jobs:
    pipeline:
        #     v2.0.1
        uses: oberon-oss/github-workflows/.github/workflows/maven-pipeline.yml@0179c3438b2073205acae0315fca63484ba4182f
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
            NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}